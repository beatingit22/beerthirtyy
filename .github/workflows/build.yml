name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo files
        run: find . -not -path './.git/*' -maxdepth 4 | sort | head -80
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -1)
          if [ -z "$G" ]; then echo "ERROR: gradlew was not uploaded to the repo"; exit 1; fi
          cd "$(dirname "$G")"
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: beer30-client
          path: "**/build/libs/beer30-client-*.jar"
