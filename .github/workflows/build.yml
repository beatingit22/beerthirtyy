name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo files
        run: find . -not -path './.git/*' -maxdepth 4 | sort | head -80
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.1" }
      - name: Build
        run: |
          B=$(find . -name build.gradle -not -path './.git/*' | head -1)
          if [ -z "$B" ]; then echo "ERROR: build.gradle was not uploaded"; exit 1; fi
          cd "$(dirname "$B")"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: beer30-client
          path: "**/build/libs/beer30-client-*.jar"
